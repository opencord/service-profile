---

xos_repo: https://gerrit.opencord.org/p/xos.git

base_dir: "{{ config_dir }}/../.."

xos_core_dir: "{{ base_dir }}/xos"

xos_services_dir: "{{ base_dir }}/xos_services"

bootstrap_yml: "{{ config_dir }}/docker-compose-bootstrap.yml"

bootstrap_project: "cordpodbs"

bootstrap_port: 81

bootstrap_user: "padmin@vicci.org"
bootstrap_password: "letmein"

disable_onboarding_tosca_yml: "{{ config_dir }}/../common/disable-onboarding.yaml"
enable_onboarding_tosca_yml: "{{ config_dir }}/../common/disable-onboarding.yaml"

onboard_services:
 - "{{ xos_services_dir }}/vrouter/xos/vrouter-onboard.yaml"
 - "{{ xos_services_dir }}/olt/xos/volt-onboard.yaml"
 - "{{ xos_services_dir }}/vsg/xos/vsg-onboard.yaml"
 - "{{ xos_services_dir }}/vtn/xos/vtn-onboard.yaml"
 - "{{ xos_services_dir }}/onos-service/xos/onos-onboard.yaml"
 - "{{ xos_services_dir }}/fabric/xos/fabric-onboard.yaml"
 - "{{ xos_services_dir }}/vtr/xos/vtr-onboard.yaml"

