---
# tasks for prereqs

- name: install httpie
  apt:
      pkg=httpie

- name: install curl
  apt:
      pkg=curl

- name: is docker installed
  command: which docker
  register: docker_installed

- name: install docker
  command: wget wget -qO- https://get.docker.com/ | sh
  when: docker_installed.rc != 0

- name: add user to docker group
  user:
      name={{ ansible_ssh_user }}
      groups=docker
